<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver safety leaderboard</title>
<style>
:root { --bg:#f7f6f3; --card:#fff; --fg:#1d1d1b; --muted:#6b6a66; --line:#e3e1db; --bar:#2f6fed; --ok:#1a7f4b; --warn:#b4540a; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1f1f1d; --fg:#f1efe9; --muted:#a09e97; --line:#33322f; --bar:#6f9bff; --ok:#54c28a; --warn:#f0a35a; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width:640px; margin:0 auto; padding:16px 14px 40px; }
h1 { font-size:1.4rem; margin:6px 0 2px; }
.sub { color:var(--muted); font-size:.85rem; margin:0 0 12px; }
.banner { background:var(--card); border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:8px 12px; font-size:.85rem; margin-bottom:12px; }
.me { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
.me label { font-size:.85rem; color:var(--muted); display:block; margin-bottom:4px; }
.me select { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
.mine { margin-top:10px; font-size:1.05rem; }
.mine b { font-size:1.5rem; }
.list { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.row.me-row { border-color:var(--bar); box-shadow:0 0 0 2px var(--bar) inset; }
.row button { all:unset; display:block; width:100%; cursor:pointer; }
.top { display:flex; align-items:center; gap:10px; }
.rank { width:2rem; text-align:center; font-weight:700; color:var(--muted); }
.name { flex:1; font-weight:600; }
.score { font-variant-numeric:tabular-nums; font-weight:700; }
.track { height:8px; background:var(--line); border-radius:99px; margin-top:8px; overflow:hidden; }
.fill { height:100%; background:var(--bar); border-radius:99px; }
.detail { display:none; margin-top:10px; font-size:.85rem; color:var(--muted); }
.row.open .detail { display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
.detail span:nth-child(even) { color:var(--fg); text-align:right; font-variant-numeric:tabular-nums; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
.chip.good { color:var(--ok); border-color:var(--ok); }
.sec { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
.sec h2 { font-size:1rem; margin:0 0 6px; }
.sec ol, .sec ul { margin:0; padding-left:1.2rem; }
.sec li { margin:2px 0; }
.sec .none { color:var(--muted); font-size:.85rem; }
.how { margin-top:18px; font-size:.8rem; color:var(--muted); }
.err { color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1 id="title">Driver safety leaderboard</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="banner" id="sample" hidden></div>
  <div class="me">
    <label for="who">Find yourself</label>
    <select id="who"><option value="">Pick your name</option></select>
    <div class="mine" id="mine" hidden></div>
  </div>
  <div class="sec"><h2>Clean week</h2><div id="clean"></div></div>
  <div class="sec"><h2>Most improved this month</h2><div id="improved"></div></div>
  <ul class="list" id="list"></ul>
  <p class="how" id="how"></p>
</main>
<script>
(function () {
  var fmt1 = function (n) { return (Math.round(n * 10) / 10).toFixed(1); };
  var el = function (id) { return document.getElementById(id); };
  var mineKey = 'wlx-scorecard-me';
  fetch('data.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('Could not load scores.');
    return r.json();
  }).then(function (d) {
    var comps = d.components, minMiles = d.min_miles || 0;
    var rows = d.drivers.map(function (x) {
      var pen = 0; comps.forEach(function (c) { pen += c.weight * (x.rates[c.key] || 0); });
      var score = Math.max(0, 100 - pen);
      var ok = x.local ? (x.days_driven >= (d.min_days_local || 0)) : (x.miles >= minMiles);
      var imp = (x.score_prior !== undefined && x.score_prior !== null) ? null : null;
      return Object.assign({ score: score, eligible: ok, improvement: (x.score_prior !== undefined && x.score_prior !== null) ? score - x.score_prior : null }, x);
    });
    var ranked = rows.filter(function (r) { return r.eligible; }).sort(function (a, b) { return b.score - a.score; });
    ranked.forEach(function (r, i) { r.rank = i + 1; });
    var unranked = rows.filter(function (r) { return !r.eligible; });
    el('title').textContent = d.title || 'Driver safety leaderboard';
    el('sub').textContent = (d.period || '') + ' · updated ' + d.updated;
    el('sample').hidden = !d.banner; el('sample').textContent = d.banner || '';
    var all = ranked.concat(unranked);
    var sel = el('who');
    all.map(function (r) { return r.name; }).sort().forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
    var list = el('list');
    all.forEach(function (r) {
      var li = document.createElement('li'); li.className = 'row'; li.dataset.name = r.name;
      var b = document.createElement('button');
      var top = document.createElement('div'); top.className = 'top';
      var rank = document.createElement('div'); rank.className = 'rank'; rank.textContent = r.eligible ? r.rank : '–';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = r.name;
      var sc = document.createElement('div'); sc.className = 'score'; sc.textContent = fmt1(r.score);
      top.appendChild(rank); top.appendChild(nm); top.appendChild(sc);
      var track = document.createElement('div'); track.className = 'track';
      var fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = r.score + '%'; track.appendChild(fill);
      var det = document.createElement('div'); det.className = 'detail';
      [['Miles', Math.round(r.miles).toLocaleString()]].concat(comps.map(function (c) { return [c.label, (r.counts ? String(r.counts[c.key] || 0) : (r.rates[c.key] || 0).toFixed(2))]; })).forEach(function (p) {
        var a = document.createElement('span'); a.textContent = p[0]; var c = document.createElement('span'); c.textContent = p[1]; det.appendChild(a); det.appendChild(c);
      });
      if (!r.eligible) { var n = document.createElement('span'); n.textContent = 'Not ranked yet'; var m = document.createElement('span'); m.textContent = 'Needs ' + minMiles.toLocaleString() + ' miles'; det.appendChild(n); det.appendChild(m); }
      var chips = document.createElement('div'); chips.className = 'chips';
      var st = document.createElement('span'); st.className = 'chip'; st.textContent = r.days_since_event + (r.days_since_event === 1 ? ' day' : ' days') + ' since last event'; chips.appendChild(st);
      if (r.clean_week) { var cw = document.createElement('span'); cw.className = 'chip good'; cw.textContent = 'Clean week'; chips.appendChild(cw); }
      if (r.local) { var lc = document.createElement('span'); lc.className = 'chip'; lc.textContent = 'Local'; chips.appendChild(lc); }
      b.appendChild(top); b.appendChild(chips); b.appendChild(track); b.appendChild(det); li.appendChild(b); list.appendChild(li);
      b.addEventListener('click', function () { li.classList.toggle('open'); });
    });
    function fill(id, rows, label) {
      var box = el(id); box.textContent = '';
      if (!rows.length) { var n = document.createElement('div'); n.className = 'none'; n.textContent = 'Nobody yet this period.'; box.appendChild(n); return; }
      var ol = document.createElement('ol');
      rows.forEach(function (r) { var li = document.createElement('li'); li.textContent = r.name + ' – ' + label(r); ol.appendChild(li); });
      box.appendChild(ol);
    }
    var clean = all.filter(function (r) { return r.eligible && r.clean_week; }).sort(function (a, b) { return b.days_since_event - a.days_since_event; });
    fill('clean', clean, function (r) { return r.days_since_event + ' days since last event'; });
    var imp = all.filter(function (r) { return r.eligible && r.improvement !== null && r.improvement > 0; }).sort(function (a, b) { return b.improvement - a.improvement; }).slice(0, 3);
    if (!all.some(function (r) { return r.improvement !== null; })) { var nb = el('improved'); nb.textContent = ''; var nn = document.createElement('div'); nn.className = 'none'; nn.textContent = 'Starts once there are two full months of data.'; nb.appendChild(nn); } else fill('improved', imp, function (r) { return '+' + fmt1(r.improvement) + ' points (' + fmt1(r.score_prior) + ' to ' + fmt1(r.score) + ')'; });
    function pick(name) {
      try { localStorage.setItem(mineKey, name); } catch (e) {}
      document.querySelectorAll('.row').forEach(function (n) { n.classList.toggle('me-row', n.dataset.name === name); });
      var r = all.filter(function (x) { return x.name === name; })[0];
      var m = el('mine');
      if (!r) { m.hidden = true; return; }
      m.hidden = false;
      m.textContent = '';
      var t = document.createElement('span'); t.textContent = r.eligible ? 'You are ranked ' : 'Not ranked yet. Score: ';
      var bb = document.createElement('b'); bb.textContent = r.eligible ? '#' + r.rank + ' of ' + ranked.length : fmt1(r.score);
      m.appendChild(t); m.appendChild(bb);
      if (r.eligible) { var s = document.createElement('span'); s.textContent = ' with a score of ' + fmt1(r.score); m.appendChild(s); }
      if (r.score_prior !== undefined && r.score_prior !== null) { var tr = document.createElement('div'); tr.style.fontSize = '.9rem'; tr.style.color = 'var(--muted)'; var ch = r.score - r.score_prior; tr.textContent = 'Last month: ' + fmt1(r.score_prior) + (ch >= 0 ? ' (up ' : ' (down ') + fmt1(Math.abs(ch)) + ' points)'; m.appendChild(tr); }
    }
    sel.addEventListener('change', function () { pick(sel.value); });
    try { var saved = localStorage.getItem(mineKey); if (saved) { sel.value = saved; pick(saved); } } catch (e) {}
    el('how').textContent = 'Higher is safer. Everyone starts at 100. Points come off for following-distance, stop-sign, lane-change, hard-braking and speeding events, adjusted for how many miles each driver drove so high-mileage drivers are not penalized. The numbers in each driver’s details are event counts for the period. Days since last event counts only days the driver was out driving. A clean week means no events and enough driving that week. Most improved compares this month’s score with the driver’s own score the month before. Tap a driver to see the details. Drivers need ' + minMiles.toLocaleString() + ' miles in the period to be ranked.';
  }).catch(function (e) {
    el('sub').textContent = e.message; el('sub').className = 'sub err';
  });
})();
</script>
</body>
</html>
